version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    container_name: lost-in-the-echo-db
    environment:
      POSTGRES_DB: lost_in_the_echo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - app-network

  # Node.js приложение
  app:
    build: .
    container_name: lost-in-the-echo-app
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_NAME: lost_in_the_echo
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    networks:
      - app-network
    restart: unless-stopped

  # Миграции (отдельный сервис)
  migrate:
    build: .
    container_name: lost-in-the-echo-migrate
    environment:
      NODE_ENV: production
      DB_NAME: lost_in_the_echo
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_HOST: postgres
      DB_PORT: 5432
    command: npm run migrate:up
    depends_on:
      - postgres
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
