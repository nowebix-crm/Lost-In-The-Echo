version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    container_name: lost-in-the-echo-db-dev
    environment:
      POSTGRES_DB: lost_in_the_echo_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - dev-network

  # Redis для кеширования (опционально)
  redis:
    image: redis:7-alpine
    container_name: lost-in-the-echo-redis-dev
    ports:
      - "6379:6379"
    networks:
      - dev-network

volumes:
  postgres_dev_data:

networks:
  dev-network:
    driver: bridge
